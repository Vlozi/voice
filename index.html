<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Резервный Голос</title>
    <!-- Используем гарантированно рабочую глобальную CDN ссылку -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; background: #2f3136; color: #fff; text-align: center; padding-top: 20px; }
        button { padding: 12px 20px; font-size: 16px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; background: #5865F2; color: white; font-weight: bold; }
        #status { font-size: 18px; margin: 15px; color: #faa81a; }
        input { padding: 10px; font-size: 16px; width: 200px; border-radius: 5px; border: none; }
        #log-box { width: 80%; max-width: 600px; height: 150px; background: #000; color: #0f0; font-family: monospace; text-align: left; padding: 10px; margin: 20px auto; overflow-y: scroll; border: 1px solid #4f545c; font-size: 12px; }
    </style>
</head>
<body>

    <h1>P2P Резервный Голос (Исправленный)</h1>
    
    <div id="mic-box">
        <button style="background:#3ba55d;" onclick="requestMicrophone()">👉 ВКЛЮЧИТЬ МИКРОФОН 👈</button>
    </div>

    <div id="status" style="display:none;">Статус: Ожидание...</div>
    
    <div id="chat-box" style="display:none;">
        <h2 id="my-id" style="color: #faa81a; font-size: 28px;">Получение ID...</h2>
        <input type="text" id="peer-id-input" placeholder="ID друга">
        <button onclick="connectToFriend()">Подключиться к другу</button>
    </div>

    <h3>Логи системы:</h3>
    <div id="log-box">=== Старт логов ===<br></div>

    <script>
        let localStream;
        let peer;

        function addLog(text) {
            const box = document.getElementById('log-box');
            box.innerHTML += "[" + new Date().toLocaleTimeString() + "] " + text + "<br>";
            box.scrollTop = box.scrollHeight;
        }

        // Проверяем сразу при загрузке, видит ли браузер библиотеку звонков
        window.onload = function() {
            if (typeof window.Peer !== 'undefined') {
                addLog("Сетевая библиотека PeerJS успешно загружена браузером.");
            } else {
                addLog("ОШИБКА: Библиотека PeerJS не загрузилась. Проверьте интернет или VPN.");
            }
        };

        function requestMicrophone() {
            addLog("Запрос доступа к микрофону...");
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    localStream = stream;
                    document.getElementById('mic-box').style.display = 'none';
                    document.getElementById('status').style.display = 'block';
                    document.getElementById('chat-box').style.display = 'block';
                    addLog("Микрофон успешно подключен и активен.");
                    initP2P();
                })
                .catch(err => {
                    addLog("ОШИБКА МИКРОФОНА: " + err.message);
                    alert("Ошибка доступа к микрофону. Разрешите его в браузере.");
                });
        }

        function initP2P() {
            addLog("Подключение к центральному сигнальному серверу...");
            try {
                // Создаем подключение со встроенным бесплатным STUN Google для обхода серых IP
                peer = new window.Peer({
                    config: {'iceServers': [{ 'urls': 'stun:://google.com' }]}
                });

                peer.on('open', (id) => {
                    document.getElementById('my-id').innerText = id;
                    document.getElementById('status').innerText = 'Вы в сети. Ждем друзей!';
                    document.getElementById('status').style.color = '#3ba55d';
                    addLog("УСПЕХ! Сервер выдал ID комнаты: " + id);
                });

                peer.on('error', (err) => {
                    addLog("Сетевая ошибка PeerJS: " + err.type + " - " + err.message);
                });

                peer.on('call', (call) => {
                    addLog("Обнаружен входящий вызов от друга. Соединяю...");
                    call.answer(localStream);
                    call.on('stream', (remoteStream) => { playRemoteStream(remoteStream); });
                });
            } catch(e) {
                addLog("Критическая ошибка инициализации сети: " + e.message);
            }
        }

        function connectToFriend() {
            const friendId = document.getElementById('peer-id-input').value;
            if (!friendId) return alert("Сначала введите ID друга!");
            addLog("Вызываю друга на P2P канал. ID: " + friendId);
            
            const call = peer.call(friendId, localStream);
            call.on('stream', (remoteStream) => { playRemoteStream(remoteStream); });
        }

        function playRemoteStream(remoteStream) {
            addLog("Прямой P2P мост построен! Аудиопоток воспроизводится.");
            const audio = document.createElement('audio');
            audio.srcObject = remoteStream;
            audio.autoplay = true;
            document.body.appendChild(audio);
        }
    </script>
</body>
</html>
