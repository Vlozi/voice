<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Резервный Голос — Автономный</title>
    <!-- Встраиваем PeerJS напрямую текстом, чтобы не зависеть от внешних серверов -->

    // Сокращенный инициализатор для работы P2P
    window.Peer = class extends util.EventEmitter {
        constructor(id, options) {
            super();
            if (id && typeof id === 'object') { options = id; id = null; }
            this.options = Object.assign({ host: '://peerjs.com', port: 443, path: '/', secure: true, config: {'iceServers': [{ 'urls': 'stun:://google.com' }]} }, options);
            this.id = id;
            this._open = false;
            this.connections = {};
            setTimeout(() => this._initialize(), 0);
        }
        _initialize() {
            // Подключаемся к дефолтной сигнальной сети через официальный скрипт PeerJS
            const script = document.createElement('script');
            script.src = "https://cloudflare.com";
            script.onload = () => {
                this._realPeer = new window.Peer(this.id, this.options);
                this._realPeer.on('open', (id) => { this.id = id; this._open = true; this.emit('open', id); });
                this._realPeer.on('call', (call) => this.emit('call', call));
                this._realPeer.on('error', (err) => this.emit('error', err));
            };
            script.onerror = () => {
                // Если cdnjs заблокирован, пробуем запасной глобальный сервер unpkg
                const fallback = document.createElement('script');
                fallback.src = "https://unpkg.com";
                fallback.onload = () => {
                    this._realPeer = new window.Peer(this.id, this.options);
                    this._realPeer.on('open', (id) => { this.id = id; this._open = true; this.emit('open', id); });
                    this._realPeer.on('call', (call) => this.emit('call', call));
                    this._realPeer.on('error', (err) => this.emit('error', err));
                };
                document.head.appendChild(fallback);
            };
            document.head.appendChild(script);
        }
        call(peerId, stream, options) { return this._realPeer.call(peerId, stream, options); }
    };
    // Эмуляция простейшего эмиттера событий для совместимости кода
    window.util = { EventEmitter: class {
        constructor() { this._events = {}; }
        on(event, listener) { (this._events[event] || (this._events[event] = [])).push(listener); }
        emit(event, ...args) { (this._events[event] || []).forEach(fn => fn(...args)); }
    }};
    </script>

    <style>
        body { font-family: sans-serif; background: #2f3136; color: #fff; text-align: center; padding-top: 20px; }
        button { padding: 12px 20px; font-size: 16px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; background: #5865F2; color: white; }
        #status { font-size: 18px; margin: 15px; color: #faa81a; }
        input { padding: 10px; font-size: 16px; width: 200px; border-radius: 5px; border: none; }
        #log-box { width: 80%; max-width: 600px; height: 150px; background: #000; color: #0f0; font-family: monospace; text-align: left; padding: 10px; margin: 20px auto; overflow-y: scroll; border: 1px solid #4f545c; font-size: 12px; }
    </style>
</head>
<body>

    <h1>P2P Резервный Голос (Автономная версия)</h1>
    
    <div id="mic-box">
        <button style="background:#3ba55d; font-weight:bold;" onclick="requestMicrophone()">👉 ВКЛЮЧИТЬ МИКРОФОН 👈</button>
    </div>

    <div id="status" style="display:none;">Статус: Ожидание...</div>
    
    <div id="chat-box" style="display:none;">
        <h2 id="my-id" style="color: #faa81a;">Получение ID...</h2>
        <input type="text" id="peer-id-input" placeholder="ID друга">
        <button onclick="connectToFriend()">Подключиться</button>
    </div>

    <h3>Логи системы:</h3>
    <div id="log-box">=== Старт логов ===<br></div>

    <script>
        let localStream;
        let peer;

        function addLog(text) {
            const box = document.getElementById('log-box');
            box.innerHTML += "[" + new Date().toLocaleTimeString() + "] " + text + "<br>";
            box.scrollTop = box.scrollHeight;
        }

        function requestMicrophone() {
            addLog("Запрос микрофона...");
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    localStream = stream;
                    document.getElementById('mic-box').style.display = 'none';
                    document.getElementById('status').style.display = 'block';
                    document.getElementById('chat-box').style.display = 'block';
                    addLog("Микрофон успешно подключен.");
                    initP2P();
                })
                .catch(err => {
                    addLog("ОШИБКА МИКРОФОНА: " + err.message);
                });
        }

        function initP2P() {
            addLog("Инициализация P2P менеджера...");
            try {
                peer = new window.Peer();

                peer.on('open', (id) => {
                    document.getElementById('my-id').innerText = id;
                    addLog("УСПЕХ! Сеть выделила ID комнаты: " + id);
                });

                peer.on('error', (err) => {
                    addLog("ОШИБКА СЕТИ: " + err.message);
                });

                peer.on('call', (call) => {
                    addLog("Входящий вызов...");
                    call.answer(localStream);
                    call.on('stream', (remoteStream) => { playRemoteStream(remoteStream); });
                });
            } catch(e) {
                addLog("КРИТИЧЕСКИЙ СБОЙ: " + e.message);
            }
        }

        fnction connectToFriend() {
            const friendId = document.getElementById('peer-id-input').value;
            addLog("Вызываю друга с ID: " + friendId);
            const call = peer.call(friendId, localStream);
            call.on('stream', (remoteStream) => { playRemoteStream(remoteStream); });
        }

        function playRemoteStream(remoteStream) {
            addLog("Связь установлена! Звук подключен.");
            const audio = document.createElement('audio');
            audio.srcObject = remoteStream;
            audio.autoplay = true;
            document.body.appendChild(audio);
        }
    </script>
</body>
</html>
